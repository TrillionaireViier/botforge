<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Robot Head -->
  <rect x="6" y="8" width="16" height="14" rx="2" fill="#000000" />
  <!-- Glowing Robot Eye -->
  <circle cx="14" cy="15" r="2.5" fill="#00d4aa" />
  <!-- Antenna -->
  <path d="M14 8 V3" stroke="#000000" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="14" cy="2" r="2" fill="#000000" />
  
  <!-- Robot Body & Arm -->
  <path d="M14 22 V30 M14 30 L26 24" stroke="#000000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Robotic Arm Holding Hammer -->
  <path d="M26 24 L38 14" stroke="#000000" stroke-width="4" stroke-linecap="round" />
  
  <!-- Blacksmith Hammer -->
  <rect x="34" y="8" width="16" height="10" rx="1.5" fill="#000000" transform="rotate(-30 42 13)" />

  <!-- Anvil Base -->
  <path d="M14 46 H50 L44 36 H52 V32 H22 L14 36 Z" fill="#000000" />
  <path d="M24 46 V54 H40 V46" fill="#000000" />
  <rect x="18" y="54" width="28" height="4" rx="1" fill="#000000" />

  <!-- Sparks from Impact -->
  <path d="M30 28 L26 20 M36 28 L38 18 M40 32 L48 26" stroke="#ffb703" stroke-width="3" stroke-linecap="round" />
</svg>